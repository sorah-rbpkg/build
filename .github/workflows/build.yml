name: build

# No concurrency group: cancelling a run would hide its remaining failures, and release.js
# refuses to release a distro that another run has already released.
# jactionlint ignore=concurrency-limits
on:
  push:
    branches: [main]
    paths:
      - 'gen/builds/*.json'
  workflow_dispatch:
    inputs:
      series:
        description: Series under builds/, e.g. ruby4.0
        required: true
        type: string
      distros:
        description: Comma separated distros to build (default all unreleased)
        required: false
        type: string
      test:
        description: Release into test/ of this repository instead of the source repository, rebuilding released distros
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      origs: ${{ steps.plan.outputs.origs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # bin/plan diffs against the commit before the push.
          fetch-depth: 0

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: ruby

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: plan
        with:
          script: await require('./.github/scripts/plan.js')({ context, core, exec })

  orig:
    name: orig (${{ matrix.orig.orig_name }})
    needs: [plan]
    if: needs.plan.outputs.origs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        orig: ${{ fromJSON(needs.plan.outputs.origs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Deterministic, and compared with any copy already in the apt repository.
      - name: generate
        run: .github/scripts/orig.sh
        env:
          REPOSITORY: ${{ matrix.orig.repository }}
          SOURCE: ${{ matrix.orig.source }}
          UPSTREAM_VERSION: ${{ matrix.orig.upstream_version }}
          UPSTREAM_COMMIT: ${{ matrix.orig.upstream_commit }}
          ORIG_NAME: ${{ matrix.orig.orig_name }}

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: ruby
          # A restored cache could alter the check below.
          cache: false

      - name: verify
        run: bin/verify-orig "out/${ORIG_NAME}" "$UPSTREAM_VERSION"
        env:
          UPSTREAM_VERSION: ${{ matrix.orig.upstream_version }}
          ORIG_NAME: ${{ matrix.orig.orig_name }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: out/${{ matrix.orig.orig_name }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orig-${{ matrix.orig.orig_name }}
          path: out/${{ matrix.orig.orig_name }}
          if-no-files-found: error

      - name: save attestation url
        run: |
          mkdir -p attestation
          printf '%s\n' "$ATTESTATION_URL" > attestation/orig
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestation-${{ matrix.orig.orig_name }}
          path: attestation/
          if-no-files-found: error

  distro:
    name: ${{ matrix.target.source }} ${{ matrix.target.distro }}${{ matrix.target.test && ' (test)' || '' }}
    needs: [plan, orig]
    if: needs.plan.outputs.targets != '[]'
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    uses: ./.github/workflows/_distro.yml # zizmor: ignore[self-repository]
    with:
      target: ${{ toJSON(matrix.target) }}
    secrets:
      STS_CAT_ENDPOINT: ${{ secrets.STS_CAT_ENDPOINT }}
