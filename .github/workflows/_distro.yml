# Builds, tests and releases one distro of one series. A target is an entry of bin/plan's "targets".
name: distro

on:
  workflow_call:
    inputs:
      target:
        description: JSON of one bin/plan target
        required: true
        type: string
    secrets:
      STS_CAT_ENDPOINT:
        required: true

permissions: {}

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # gitsign signs the merge commit with this workflow's identity.
      id-token: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: aqua:sigstore/gitsign

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: merge
        env:
          TARGET: ${{ inputs.target }}
          GH_TOKEN: ${{ github.token }}
        with:
          script: await require('./.github/scripts/merge.js')({ core, exec })

  build:
    name: build (${{ matrix.arch }})
    needs: [merge]
    # bin/plan picks the runner per series.
    runs-on: ${{ fromJSON(inputs.target).runners[matrix.arch] }}
    # Ruby's whole test suite took up to 16 minutes on 4-core runners, and a hung test bills by the minute here.
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.target).archs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.merge.outputs.sha }}
          path: src

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: fromJSON(inputs.target).orig_name
        with:
          name: orig-${{ fromJSON(inputs.target).orig_name }}
          path: orig

      # Printed after every transfer, so the logs show each job handled the same bytes.
      - name: checksums
        if: fromJSON(inputs.target).orig_name
        run: sha256sum orig/*

      - name: debuild
        run: .github/scripts/debuild.sh
        env:
          SOURCE: ${{ fromJSON(inputs.target).source }}
          DISTRO: ${{ fromJSON(inputs.target).distro }}
          ORIG_NAME: ${{ fromJSON(inputs.target).orig_name }}
          DOCKERFILE: ${{ fromJSON(inputs.target).dockerfile }}
          # The first arch also builds the source package and arch:all packages.
          BUILD: ${{ matrix.arch == fromJSON(inputs.target).archs[0] && 'full' || 'any' }}
          JOB_ID: ${{ job.check_run_id }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: out/*

      - name: checksums
        run: sha256sum out/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ fromJSON(inputs.target).id }}-${{ fromJSON(inputs.target).distro }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

      # Kept apart from out/, every file of which becomes a release asset.
      - name: save attestation url
        run: |
          mkdir -p attestation
          printf '%s\n' "$ATTESTATION_URL" > "attestation/${ARCH}"
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          ARCH: ${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestation-${{ fromJSON(inputs.target).id }}-${{ fromJSON(inputs.target).distro }}-${{ matrix.arch }}
          path: attestation/
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.arch }})
    needs: [build]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.target).archs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # arch:all packages come from the first arch's artifact.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ fromJSON(inputs.target).id }}-${{ fromJSON(inputs.target).distro }}-*
          merge-multiple: true
          path: out

      - name: checksums
        run: sha256sum out/*

      - name: smoke
        run: .github/scripts/smoke.sh
        env:
          IMAGE: ${{ fromJSON(inputs.target).image }}
          SMOKE: ${{ fromJSON(inputs.target).smoke }}
          SOURCE: ${{ fromJSON(inputs.target).source }}
          DISTRO: ${{ fromJSON(inputs.target).distro }}
          ARCH: ${{ matrix.arch }}

  # A failed smoke leaves the release to the approver, so the built artifacts are not thrown away.
  smoke-warn:
    needs: [smoke]
    if: ${{ !cancelled() && needs.smoke.result == 'failure' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: echo "::warning title=smoke failed::${SOURCE} ${DISTRO} failed its smoke test; check it before approving the release"
        env:
          SOURCE: ${{ fromJSON(inputs.target).source }}
          DISTRO: ${{ fromJSON(inputs.target).distro }}

  release:
    needs: [merge, smoke, smoke-warn]
    if: ${{ !cancelled() && needs.merge.result == 'success' && (needs.smoke.result == 'success' || needs.smoke-warn.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: release
      url: https://github.com/${{ fromJSON(inputs.target).release_repository }}/releases
    permissions:
      # Deletes the stage branch once released, and receives the release of a test run.
      contents: write
      # sts-cat and gitsign.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: aqua:sigstore/gitsign
          # A restored cache could alter what this job signs.
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ fromJSON(inputs.target).id }}-${{ fromJSON(inputs.target).distro }}-*
          merge-multiple: true
          path: out

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: attestation-${{ fromJSON(inputs.target).id }}-${{ fromJSON(inputs.target).distro }}-*
          merge-multiple: true
          path: attestation

      # Attached to every distro's release.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: fromJSON(inputs.target).orig_name
        with:
          name: orig-${{ fromJSON(inputs.target).orig_name }}
          path: out

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: fromJSON(inputs.target).orig_name
        with:
          name: attestation-${{ fromJSON(inputs.target).orig_name }}
          path: attestation

      - name: checksums
        run: sha256sum out/*

      # A test run never obtains a token for the source repository, so it cannot write there.
      - uses: sorah/sts-cat/.github/actions/exchange-token@19e1177084d0f2dedb575ab1b78bd2a1a100f6e9 # main
        id: token
        if: ${{ !fromJSON(inputs.target).test }}
        with:
          endpoint: ${{ secrets.STS_CAT_ENDPOINT }}
          scope: ${{ github.repository_owner }}
          identity: build
          audience: https://sts-cat.nkmi.me

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        name: tag and push
        env:
          TARGET: ${{ inputs.target }}
          STAGE_SHA: ${{ needs.merge.outputs.sha }}
          RELEASE_TOKEN: ${{ fromJSON(inputs.target).test && github.token || steps.token.outputs.token }}
        with:
          script: await require('./.github/scripts/release.js')({ core, exec })

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        name: draft release
        env:
          TARGET: ${{ inputs.target }}
          DIR: out
          ATTESTATION_DIR: attestation
        with:
          github-token: ${{ fromJSON(inputs.target).test && github.token || steps.token.outputs.token }}
          script: await require('./.github/scripts/draft-release.js')({ github, core })

      - name: delete stage branch
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${STAGE_BRANCH}"
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_BRANCH: ${{ fromJSON(inputs.target).stage_branch }}
